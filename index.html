<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLAX HUB - الأداء الأفضل في روبلوكس</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            --main-red: #cc0000;
            --bright-red: #ff0000;
            --glass-black: rgba(0, 0, 0, 0.7);
            --border-glass: rgba(255, 0, 0, 0.2);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050505; /* أسود عميق */
            background-image: radial-gradient(circle at center, #200000 0%, #050505 100%);
            color: #ffffff;
            margin: 0;
            direction: rtl;
        }

        /* تأثير الزجاج الأحمر */
        .glass-panel {
            background: var(--glass-black);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(255, 0, 0, 0.1);
        }

        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(204, 0, 0, 0.2), transparent);
        }

        h1 {
            font-weight: 900;
            color: var(--bright-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .button-primary {
            background: var(--main-red);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(204, 0, 0, 0.3);
        }

        .button-primary:hover {
            background: var(--bright-red);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.5);
        }

        /* تعديل خانة الكود لتكون زجاجية */
        #code-display {
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid var(--main-red);
            color: #ffcccc;
            padding: 20px;
            border-radius: 10px;
            font-family: monospace;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SLAX HUB</h1>
        <p>تحسين أداء روبلوكس بأقصى قوة</p>
    </div>

    <div class="container">
        <div class="glass-panel" style="padding: 30px; margin: 20px;">
            <h2 style="color: var(--bright-red);">إعدادات FFlags المعدلة</h2>
            <p>تم تخصيص هذه الإعدادات بواسطة SLAX HUB لتعطيك أعلى فريمات ممكنة.</p>
            
            <div id="code-display">
                {
                   "FFlagDebugGraphicsDisableDirect3D11":"True",
                   "DFIntFileCacheReserveSize":"2147483647",
                   ...
                }
            </div>

            <button class="button-primary" onclick="copyCode()">نسخ الكود بالكامل</button>
        </div>
    </div>

    <script>
        function copyCode() {
            // وظيفة النسخ
            alert("تم نسخ كود SLAX HUB بنجاح!");
        }
    </script>
</body>
</html>
